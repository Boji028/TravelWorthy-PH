[pytest]
# Pytest configuration for Travel Agency test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directory
testpaths = tests

# Minimal verbosity output
addopts = -v --tb=short --strict-markers

# Markers for categorizing tests
markers =
    auth: Authentication and user management tests
    bookings: Booking system tests
    models: Database model tests
    forms: Form validation tests
    integration: Integration tests
    slow: Slow running tests

# Coverage options (use with: pytest --cov=.)
# Show missing lines in coverage report
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
