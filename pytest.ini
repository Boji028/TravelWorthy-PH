[pytest]
# Pytest configuration for Travel Agency test suite

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directory
testpaths = tests

# Minimal verbosity output
addopts = -v --tb=short --strict-markers

# Suppress the flask-limiter "no storage backend" notice during tests —
# expected and harmless since each test spins up a fresh in-memory app;
# only matters for production deployment, not for test runs.
filterwarnings =
    ignore::UserWarning:flask_limiter._extension

# Markers for categorizing tests
markers =
    auth: Authentication and user management tests
    bookings: Booking system tests
    models: Database model tests
    forms: Form validation tests
    integration: Integration tests
    slow: Slow running tests
    real_async_email: opts out of the autouse email-thread stub, for
        tests that specifically exercise the background-thread behavior

# Coverage options (use with: pytest --cov=.)
# Show missing lines in coverage report
[coverage:run]
source = .
omit =
    tests/*
    venv/*
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
