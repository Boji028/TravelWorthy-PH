{% extends "admin/base_admin.html" %}
{% block title %}Add Continent{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
  <h2 style="margin-bottom:1.5rem;margin-top:2rem;">Add Continent</h2>
  <div class="card" style="padding:2rem;">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="form-group">
        <label>Continent Name</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. Asia" required/>
      </div>
      <div class="form-group">
        <label>Emoji</label>
        <input type="text" name="flag_emoji" class="form-control" placeholder="e.g. 🌏"/>
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:.5rem;">
        <input type="checkbox" name="is_active" id="is_active" checked/>
        <label for="is_active" style="margin:0;">Active</label>
      </div>
      <div style="display:flex; gap:1rem; margin-top:1rem;">
        <button type="submit" class="btn btn-primary">Save Continent</button>
        <a href="{{ url_for('admin.continents') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
