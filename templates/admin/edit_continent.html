{% extends "admin/base_admin.html" %}
{% block title %}Edit Continent{% endblock %}

{% block content %}
<div style="max-width:600px; margin:0 auto;">
  <h2 style="margin-bottom:1.5rem;">Edit Continent</h2>
  <div class="card" style="padding:2rem;">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="form-group">
        <label>Continent Name</label>
        <input type="text" name="name" class="form-control" value="{{ continent.name }}" required />
      </div>
      <div class="form-group">
        <label>Emoji</label>
        <input type="text" name="flag_emoji" class="form-control" value="{{ continent.flag_emoji or '' }}" />
      </div>
      <div class="form-group" style="display:flex; align-items:center; gap:.5rem;">
        <input type="checkbox" name="is_active" id="is_active" {% if continent.is_active %}checked{% endif %} />
        <label for="is_active" style="margin:0;">Active</label>
      </div>
      <div style="display:flex; gap:1rem; margin-top:1rem;">
        <button type="submit" class="btn btn-primary">Update Continent</button>
        <a href="{{ url_for('admin.continents') }}" class="btn btn-ghost">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
