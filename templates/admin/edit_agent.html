{% extends "admin/base_admin.html" %}
{% block title %}Edit Agent — Admin{% endblock %}

{% block admin_styles %}
<style>
  .form-card {
    background: var(--surface);
    border-radius: var(--radius-lg);
    padding: 2rem;
    box-shadow: 0 2px 12px rgba(58, 46, 34, .07);
    max-width: 560px;
  }
</style>
{% endblock %}

{% block admin_content %}
<div class="admin-header">
  <h1>Edit Agent</h1>
  <p>Update details for "{{ agent.name }}"</p>
</div>

<div class="form-card">
  <form method="POST" action="{{ url_for('admin.edit_agent', agent_id=agent.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
    <div class="form-group">
      <label>Name</label>
      <input type="text" name="name" class="form-control" value="{{ agent.name }}" required />
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" name="email" class="form-control" value="{{ agent.email }}" required />
    </div>
    <div class="form-group">
      <label>Notes <span style="font-size:.8rem;color:var(--mist)">(optional)</span></label>
      <input type="text" name="notes" class="form-control" value="{{ agent.notes or '' }}" placeholder="e.g. Japan, Taiwan, China" />
    </div>
    <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:1.25rem;">
      <input type="checkbox" name="is_active" value="on" {% if agent.is_active %}checked{% endif %} id="is_active" style="width:16px;height:16px;accent-color:var(--teal);">
      <label for="is_active" style="margin:0;cursor:pointer;">Active</label>
    </div>
    <div style="display:flex;gap:1rem;">
      <button type="submit" class="btn btn-amber"><i class="fas fa-floppy-disk"></i> Save Changes</button>
      <a href="{{ url_for('admin.agents') }}" class="btn btn-ghost">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
