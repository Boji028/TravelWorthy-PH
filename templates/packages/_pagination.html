{% if pagination.pages > 1 %}
<div style="display:flex;justify-content:center;gap:.5rem;margin-top:2rem;">
  {% if pagination.has_prev %}
  <a href="{{ url_for('packages.list_packages', continent_id=continent_id, country_id=country_id, destination=destination, package_type=package_type, page=pagination.prev_num) }}" class="country-tab">← Prev</a>
  {% endif %}
  {% for p in pagination.iter_pages() %}
  {% if p %}
  <a href="{{ url_for('packages.list_packages', continent_id=continent_id, country_id=country_id, destination=destination, package_type=package_type, page=p) }}" class="country-tab {% if p == pagination.page %}active{% endif %}">{{ p }}</a>
  {% else %}
  <span style="padding:.4rem">…</span>
  {% endif %}
  {% endfor %}
  {% if pagination.has_next %}
  <a href="{{ url_for('packages.list_packages', continent_id=continent_id, country_id=country_id, destination=destination, package_type=package_type, page=pagination.next_num) }}" class="country-tab">Next →</a>
  {% endif %}
</div>
{% endif %}
