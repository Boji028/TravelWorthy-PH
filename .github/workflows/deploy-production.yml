name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    environment:
      name: ${{ github.event.inputs.environment }}
      url: ${{ steps.deploy.outputs.deployment_url }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run comprehensive tests
      env:
        DATABASE_URL: sqlite:///test.db
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key
      run: |
        pytest tests/ -v --cov=. --cov-report=term-missing -x
    
    - name: Run security checks
      run: |
        pip install bandit safety
        bandit -r . --exclude ./tests -f json -o bandit-report.json
        safety check --json
      continue-on-error: true
    
    - name: Verify version
      run: |
        VERSION=${{ github.event.inputs.version }}
        echo "Deploying version: $VERSION"
        # Could verify version exists in git tag or version file
    
    - name: Create deployment tag
      run: |
        git config user.email "ci@github.com"
        git config user.name "GitHub CI"
        git tag -a v${{ github.event.inputs.version }} -m "Release v${{ github.event.inputs.version }}" || true
        git push origin v${{ github.event.inputs.version }} || true
    
    - name: Build deployment package
      run: |
        mkdir -p dist
        cp -r app.py models/ routes/ templates/ static/ scripts/ dist/
        cp requirements.txt Procfile docker-compose.yml Dockerfile dist/
        echo "${{ github.event.inputs.version }}" > dist/VERSION
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v3
      with:
        name: deployment-package-${{ github.event.inputs.version }}
        path: dist/
    
    - name: Deploy to production
      env:
        DEPLOY_KEY: ${{ secrets.PROD_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.PROD_HOST }}
        DEPLOY_USER: ${{ secrets.PROD_USER }}
        DEPLOY_PATH: ${{ secrets.PROD_PATH }}
        VERSION: ${{ github.event.inputs.version }}
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "Production deployment skipped: Secrets not configured"
          exit 0
        fi
        
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/prod_deploy_key
        chmod 600 ~/.ssh/prod_deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        # Create backup before deployment
        ssh -i ~/.ssh/prod_deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'BACKUP_EOF'
          cd $DEPLOY_PATH
          python scripts/manage_backups.py create
        BACKUP_EOF
        
        # Deploy new version
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/prod_deploy_key" \
          dist/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
        
        # Run post-deployment tasks
        ssh -i ~/.ssh/prod_deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'DEPLOY_EOF'
          cd $DEPLOY_PATH
          source venv/bin/activate
          pip install -r requirements.txt
          flask db upgrade
          
          # Restart services
          systemctl restart travel-agency || true
          systemctl restart travel-agency-worker || true
        DEPLOY_EOF
      continue-on-error: true
    
    - name: Notify deployment
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Production deployment for v${{ github.event.inputs.version }}: ${{ job.status }}'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      continue-on-error: true
    
    - name: Create release notes
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ github.event.inputs.version }}
        release_name: Release v${{ github.event.inputs.version }}
        body: |
          Deployed to production on ${{ github.event.repository.updated_at }}
          
          Changes: https://github.com/${{ github.repository }}/compare/main...develop
        draft: false
        prerelease: false
      continue-on-error: true

  post-deployment:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()
    
    steps:
    - name: Wait for service to stabilize
      run: sleep 60
    
    - name: Health check
      run: |
        PROD_URL="${{ secrets.PROD_URL }}"
        if [ -z "$PROD_URL" ]; then
          echo "Production URL not configured"
          exit 0
        fi
        
        for i in {1..20}; do
          if curl -f $PROD_URL/health 2>/dev/null; then
            echo "Production health check passed"
            exit 0
          fi
          echo "Health check attempt $i failed"
          sleep 10
        done
        
        echo "Production health check failed"
        exit 1
      continue-on-error: true
    
    - name: Smoke tests
      run: |
        PROD_URL="${{ secrets.PROD_URL }}"
        if [ -z "$PROD_URL" ]; then
          exit 0
        fi
        
        # Test key endpoints
        curl -f $PROD_URL/ || exit 1
        curl -f $PROD_URL/packages || exit 1
        curl -f $PROD_URL/blog || exit 1
      continue-on-error: true
    
    - name: Rollback on failure
      if: failure()
      run: |
        echo "Deployment failed, consider rollback"
        # Could trigger automatic rollback script
      continue-on-error: true
