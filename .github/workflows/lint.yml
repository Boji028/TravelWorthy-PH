name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort pylint
    
    - name: Run flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings (report all)
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --format=json > flake8-report.json
      continue-on-error: true
    
    - name: Run black (formatter check)
      run: |
        black --check . --diff
      continue-on-error: true
    
    - name: Run isort (import sorting check)
      run: |
        isort --check-only . --diff
      continue-on-error: true
    
    - name: Run pylint
      run: |
        pylint --exit-zero --max-line-length=127 --load-plugins=pylint.extensions.docparams \
          app.py routes/ models/ \
          --disable=C0114,C0115,C0116,R0913,R0914
      continue-on-error: true

  type-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mypy types-Flask types-requests types-werkzeug
        pip install -r requirements.txt
    
    - name: Run mypy type checker
      run: |
        mypy app.py routes/ models/ --ignore-missing-imports --no-error-summary
      continue-on-error: true

  dependency-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Check for security vulnerabilities with pip-audit
      run: |
        python -m pip install --upgrade pip pip-audit
        pip install -r requirements.txt
        pip-audit --skip-editable
      continue-on-error: true
    
    - name: Check requirements.txt is up to date
      run: |
        # Verify all dependencies are pinned
        grep -E '^[a-zA-Z].*==' requirements.txt || echo "Warning: Some packages are not pinned"
      continue-on-error: true

  security-lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install bandit
      run: |
        python -m pip install --upgrade pip
        pip install bandit
    
    - name: Run bandit security scanner
      run: |
        bandit -r . -f json -o bandit-report.json
      continue-on-error: true
    
    - name: Display bandit results
      run: |
        python -m pip install bandit
        bandit -r . -v
      continue-on-error: true
