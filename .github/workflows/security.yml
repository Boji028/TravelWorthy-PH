name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  dependency-scanning:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install pip-audit
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
    
    - name: Install requirements
      run: |
        pip install -r requirements.txt
    
    - name: Run pip-audit for vulnerabilities
      run: |
        pip-audit --desc --format json > pip-audit-report.json
        cat pip-audit-report.json
      continue-on-error: true
    
    - name: Generate pip-audit report
      if: always()
      run: |
        pip-audit
      continue-on-error: true

  trivy-scan:
    runs-on: ubuntu-latest

    permissions:
      security-events: write

    steps:
    - uses: actions/checkout@v3
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy results to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  secret-scanning:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install detect-secrets
      run: |
        python -m pip install --upgrade pip
        pip install detect-secrets
    
    - name: Scan for secrets
      run: |
        detect-secrets scan --all-files --force-use-all-plugins > secrets-report.json
        detect-secrets audit secrets-report.json
      continue-on-error: true

  code-scanning:
    runs-on: ubuntu-latest
    
    permissions:
      security-events: write
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install requirements
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: 'python'
    
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  sast-analysis:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install SAST tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit semgrep
    
    - name: Run Bandit SAST
      run: |
        bandit -r . -f json -o bandit-report.json --exclude ./tests,./venv,./env
      continue-on-error: true
    
    - name: Run Semgrep
      run: |
        pip install semgrep
        semgrep --config p/security-audit . --json -o semgrep-report.json
      continue-on-error: true