name: Deploy to Staging

on:
  push:
    branches: [ develop ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.deployment_url }}
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests before deployment
      env:
        DATABASE_URL: sqlite:///test.db
        FLASK_ENV: testing
        SECRET_KEY: test-secret-key
      run: |
        pytest tests/ -v --tb=short -x
    
    - name: Run linting checks
      run: |
        pip install flake8
        flake8 . --max-line-length=127 --count --exit-zero
      continue-on-error: true
    
    - name: Prepare deployment
      run: |
        # Create deployment package
        mkdir -p deploy
        cp -r app.py models/ routes/ templates/ static/ scripts/ deploy/
        cp requirements.txt deploy/
        cp .env.example deploy/.env.staging
    
    - name: Deploy to staging server
      env:
        DEPLOY_KEY: ${{ secrets.STAGING_DEPLOY_KEY }}
        DEPLOY_HOST: ${{ secrets.STAGING_HOST }}
        DEPLOY_USER: ${{ secrets.STAGING_USER }}
        DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
      run: |
        if [ -z "$DEPLOY_KEY" ]; then
          echo "Deployment skipped: Secrets not configured"
          exit 0
        fi
        
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$DEPLOY_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts 2>/dev/null
        
        # Deploy
        rsync -avz --delete \
          -e "ssh -i ~/.ssh/deploy_key" \
          deploy/ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
        
        # Run post-deployment tasks
        ssh -i ~/.ssh/deploy_key $DEPLOY_USER@$DEPLOY_HOST << 'EOF'
          cd $DEPLOY_PATH
          source venv/bin/activate
          pip install -r requirements.txt
          flask db upgrade
          systemctl restart travel-agency-staging || true
        EOF
      continue-on-error: true
    
    - name: Notify deployment status
      if: always()
      run: |
        echo "Deployment to staging: ${{ job.status }}"
        # Could send notification to Slack, email, etc.

  health-check:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: always()
    
    steps:
    - name: Wait for deployment
      run: sleep 30
    
    - name: Check staging health
      run: |
        STAGING_URL="${{ secrets.STAGING_URL }}"
        if [ -z "$STAGING_URL" ]; then
          echo "Staging URL not configured, skipping health check"
          exit 0
        fi
        
        # Try to connect to staging server
        for i in {1..10}; do
          if curl -f $STAGING_URL/health 2>/dev/null; then
            echo "Health check passed"
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 10
        done
        
        echo "Health check failed"
        exit 1
      continue-on-error: true
